<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通天野马(mc_noch) - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        
        .profile {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .username {
            font-size: 2.5em;
            color: #4a5568;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 1.2em;
            color: #718096;
            margin-bottom: 30px;
        }
        
        .counter {
            background: #4a5568;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
        }
        
        .counter-time {
            font-size: 2em;
            font-weight: bold;
        }
        
        .navigation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .nav-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .nav-card:hover {
            transform: translateY(-5px);
        }
        
        .nav-title {
            font-size: 1.3em;
            color: #4a5568;
            margin-bottom: 15px;
        }
        
        .project-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        
        .project-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .contact {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        
        .contact-title {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .navigation {
                grid-template-columns: 1fr;
            }
            
            .username {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>欢迎来到我的世界</h1>
            <p>创造 · 探索 · 分享</p>
        </header>
        
        <div class="profile">
            <h2 class="username">通天野马 (mc_noch)</h2>
            <p class="tagline">Minecraft爱好者 & 独立开发者</p>
            
            <div class="counter">
                <div class="counter-time" id="minecraftCounter">
                    <!-- 计数器将通过JavaScript动态更新 -->
                </div>
                <p>Minecraft旅程计时器</p>
            </div>
            
            <div class="navigation">
                <div class="nav-card">
                    <h3 class="nav-title">🧭 主要项目</h3>
                    <p>探索我的核心创作</p>
                    <a href="#projects" class="project-btn">查看项目</a>
                </div>
                
                <div class="nav-card">
                    <h3 class="nav-title">📁 作品集</h3>
                    <p>我的完整作品展示</p>
                    <a href="#portfolio" class="project-btn">浏览作品</a>
                </div>
                
                <div class="nav-card">
                    <h3 class="nav-title">🔧 工具资源</h3>
                    <p>实用工具和资源分享</p>
                    <a href="#tools" class="project-btn">获取资源</a>
                </div>
            </div>
            
            <div id="projects">
                <h3 style="text-align: center; margin: 40px 0 20px 0;">我的项目链接</h3>
                <div style="text-align: center;">
                    <!-- 这里替换为您实际的项目链接 -->
                    <a href="https://github.com/mc_noch/project1" class="project-btn" target="_blank">项目一</a>
                    <a href="https://github.com/mc_noch/project2" class="project-btn" target="_blank">项目二</a>
                    <a href="https://github.com/mc_noch/project3" class="project-btn" target="_blank">项目三</a>
                    <a href="https://mc_noch.itch.io/" class="project-btn" target="_blank">游戏作品</a>
                </div>
            </div>
        </div>
        
        <div class="contact">
            <h3 class="contact-title">📡 联系方式</h3>
            <p>期待与您交流与合作</p>
            <div style="margin-top: 20px;">
                <a href="mailto:mc_noch@example.com" class="project-btn">发送邮件</a>
                <a href="https://discord.gg/example" class="project-btn" target="_blank">Discord</a>
            </div>
        </div>
        
        <footer>
            <p>© 2025 通天野马(mc_noch) - 保留所有权利</p>
        </footer>
    </div>

    <script>
        // Minecraft旅程计时器
        function updateMinecraftCounter() {
            const startDate = new Date('2025-01-01').getTime(); // 设置您的开始日期
            const 当前 = new Date().getTime();
            const difference = 当前 - startDate;
            
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math。floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);
            
            document。getElementById('minecraftCounter')。innerHTML = 
                `${days}天 ${hours.toString().padStart(2, '0')}时 ${minutes.toString().padStart(2, '0')}分 ${seconds.toString().padStart(2, '0')}秒`;
        }
        
        // 初始化计数器并每秒更新
        updateMinecraftCounter();
        setInterval(updateMinecraftCounter, 1000);
        
        // 平滑滚动到锚点
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
